name = "avidviewer-site"
main = "src/worker/index.js"
compatibility_date = "2026-11-01"
workers_dev = false

# Static site built by build.mjs. The Worker runs first so it can redirect www and answer /api.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = true

# Plain (non-secret) settings. Secrets (POSTMARK_TOKEN, ADMIN_EMAILS) are set in the Cloudflare dashboard as type
# Secret and survive deploys; a plain variable set only in the dashboard is replaced by this list on every deploy.
[vars]
MAIL_FROM = "Avid Viewer <hello@avidviewer.app>"

[[d1_databases]]
binding = "DB"
database_name = "avidviewer"
database_id = "f5c30e7f-05d7-4a9e-a906-cb8fcba4537b"
migrations_dir = "migrations"

[[routes]]
pattern = "avidviewer.app"
custom_domain = true

[[routes]]
pattern = "www.avidviewer.app"
custom_domain = true

[observability]
enabled = true
